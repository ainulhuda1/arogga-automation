name: Arogga Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  automation-test:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify Java
        run: java -version

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run Selenium TestNG Automation
        run: mvn clean test -DsuiteXmlFile=testng.xml -Dheadless=true -DpageLoadTimeoutSeconds=60

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            target/screenshots/
          if-no-files-found: warn
